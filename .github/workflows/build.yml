# CI + releases.
#
# Every push/PR builds and tests Linux, Windows (including the Windows
# installer, uploaded as a workflow artifact) and macOS, packs the Linux
# AppImage (also uploaded), and fuzzes the parsers for a few minutes.
# Releasing is just:
#
#   git tag v1.2.3 && git push --tags
#
# The tag must match project(VERSION) in CMakeLists.txt (checked below); the
# workflow then creates the GitHub release itself, with generated notes and the
# installer and the AppImage attached. Arch users install from the AUR
# (packaging/aur); the AppImage is for every other distribution.
name: CI

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Check tag matches CMake version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        cmake_version=$(sed -nE '/^project\(mcu-studio/,/\)/s/^[[:space:]]*VERSION[[:space:]]+([0-9]+(\.[0-9]+)*).*/\1/p' CMakeLists.txt | head -1)
        tag_version=${GITHUB_REF_NAME#v}
        if [ "$cmake_version" != "$tag_version" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match CMakeLists.txt version $cmake_version"
          exit 1
        fi
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        cache: true
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libjpeg-dev \
          libgl1-mesa-dev libxkbcommon0 libfontconfig1
    - name: Build
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build
    - name: Unit tests
      run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure
    - name: Smoke-test the binaries
      # The check is that both programs link and start, that the GUI's Qt
      # plugins resolve far enough to open a JPEG and render it under the
      # offscreen platform, and that the CLI reads one. A missing runtime
      # dependency fails here rather than on a user's desktop.
      run: |
        QT_QPA_PLATFORM=offscreen ./build/bin/mcu-studio --version
        QT_QPA_PLATFORM=offscreen ./build/bin/mcu-studio fuzz/corpus/444.jpg --screenshot screenshot.png
        test -s screenshot.png
        ./build/bin/mcu-studio-cli info fuzz/corpus/baseline_rst.jpg
        ./build/bin/mcu-studio-cli bench fuzz/corpus/444.jpg --repeat 1
    - name: Upload screenshot
      uses: actions/upload-artifact@v7
      with:
        name: linux-screenshot
        path: screenshot.png
    - name: Check install rules
      run: |
        DESTDIR="$PWD/staged" cmake --install build --prefix /usr
        test -x staged/usr/bin/mcu-studio
        test -x staged/usr/bin/mcu-studio-cli
        test -f staged/usr/share/applications/mcu-studio.desktop
        test -f staged/usr/share/icons/hicolor/scalable/apps/mcu-studio.svg
    - name: Validate the desktop entry
      run: |
        sudo apt-get install -y desktop-file-utils
        desktop-file-validate staged/usr/share/applications/mcu-studio.desktop

  appimage:
    # The oldest Ubuntu GitHub offers, not the latest: an AppImage runs only
    # where glibc is at least as new as the build machine's, and this one's
    # (2.35) is old enough for Debian 12, Ubuntu 22.04 and what came after.
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        cache: true
    - name: Install build tools
      # Beyond what the build needs, the libraries Qt's X11 and Wayland
      # plugins link: linuxdeploy copies them into the AppImage from here and
      # stops if one is missing.
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libjpeg-dev file \
          libgl1-mesa-dev libegl1 libfontconfig1 libdbus-1-3 \
          libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
          libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
          libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
          libwayland-client0 libwayland-cursor0 libwayland-egl1
    - name: Build the AppImage
      run: packaging/appimage/build.sh build-appimage
    - name: Smoke-test the AppImage
      # The file is unpacked rather than mounted (no FUSE here) and the
      # program is started as a user would start it, from AppRun, so a
      # library or Qt plugin missing from the bundle fails here. ONNX Runtime
      # is not installed on this machine, so the test passing means the
      # bundled copy opened; the test program runs from the unpacked tree
      # because that is where the program looks for it.
      run: |
        cd build-appimage
        ./McuStudio-*.AppImage --appimage-extract > /dev/null
        QT_QPA_PLATFORM=offscreen squashfs-root/AppRun --version
        QT_QPA_PLATFORM=offscreen squashfs-root/AppRun ../fuzz/corpus/444.jpg --screenshot "$PWD/screenshot.png"
        test -s screenshot.png
        squashfs-root/usr/bin/mcu-studio-cli info ../fuzz/corpus/baseline_rst.jpg
        cp build/bin/mcu_tests squashfs-root/usr/bin/
        MCU_STUDIO_EXPECT_ONNX=1 QT_QPA_PLATFORM=offscreen squashfs-root/usr/bin/mcu_tests localModelRuntime
    - name: Upload AppImage artifact
      uses: actions/upload-artifact@v7
      with:
        name: linux-appimage
        path: build-appimage/McuStudio-*.AppImage
    - name: Add to release
      # The Windows job creates the same release; whichever job gets there
      # second adds its file to it.
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: build-appimage/McuStudio-*.AppImage
        generate_release_notes: true

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        # UCRT64 rather than MINGW64: it is where MSYS2 packages ONNX Runtime.
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-pkgconf
          mingw-w64-ucrt-x86_64-qt6-base
          mingw-w64-ucrt-x86_64-qt6-tools
          mingw-w64-ucrt-x86_64-libjpeg-turbo
          mingw-w64-ucrt-x86_64-onnxruntime
    - name: Install NSIS
      # The official NSIS, not MSYS2's package: that one's plugins sit in a
      # directory makensis 3.13 doesn't search, which breaks the installer's
      # Finish page (installer/build_installer.cmake finds it in its default
      # install directory).
      shell: pwsh
      run: choco install nsis --no-progress -y
    - uses: actions/checkout@v7
    - name: Check tag matches CMake version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        cmake_version=$(sed -nE '/^project\(mcu-studio/,/\)/s/^[[:space:]]*VERSION[[:space:]]+([0-9]+(\.[0-9]+)*).*/\1/p' CMakeLists.txt | head -1)
        tag_version=${GITHUB_REF_NAME#v}
        if [ "$cmake_version" != "$tag_version" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match CMakeLists.txt version $cmake_version"
          exit 1
        fi
    - name: Build
      # ONNX is ON, not AUTO, so a build that lost the local AI Fill model
      # fails here instead of shipping without it.
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMCU_STUDIO_ONNX=ON
        cmake --build build
    - name: Unit tests
      run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure
    - name: Check the local model's runtime is deployed
      # ONNX Runtime is opened at run time, so no link step shows it missing.
      # ldd looks beside the DLL first, so anything it still finds under
      # /ucrt64 is a library dist/ lacks. The test then opens it from dist/;
      # the test program is taken out again before dist/ is packed.
      run: |
        test -f build/dist/onnxruntime.dll
        if ldd build/dist/onnxruntime.dll | grep '/ucrt64/'; then exit 1; fi
        cp build/bin/mcu_tests.exe build/dist/
        (cd build/dist && MCU_STUDIO_EXPECT_ONNX=1 QT_QPA_PLATFORM=offscreen ./mcu_tests.exe localModelRuntime)
        rm build/dist/mcu_tests.exe
    - name: Build installer
      run: cmake --build build --target installer
    - name: Upload installer artifact
      uses: actions/upload-artifact@v7
      with:
        name: windows-installer
        path: build/McuStudio-*-Setup.exe
    - name: Create release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: build/McuStudio-*-Setup.exe
        generate_release_notes: true

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: brew install cmake ninja qt libjpeg-turbo
    - name: Build
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix jpeg-turbo)"
        cmake --build build
    - name: Unit tests
      run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

  fuzz:
    # A short run of every harness on every push: enough to catch a parser
    # that regressed into a crash, under AddressSanitizer and UBSan.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        cache: true
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang libjpeg-dev
    - name: Build fuzzers
      run: |
        CC=clang CXX=clang++ cmake -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DMCU_STUDIO_FUZZ=ON -DMCU_STUDIO_BUILD_TESTS=OFF -DMCU_STUDIO_BUILD_CLI=OFF
        cmake --build build-fuzz --target fuzzers
    - name: Fuzz
      run: |
        export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
        for t in structure decode bitstream splice exif project; do
          mkdir -p corpus-$t && cp fuzz/corpus/* corpus-$t/
          ./build-fuzz/bin/fuzz_$t -max_total_time=45 -rss_limit_mb=4096 corpus-$t
        done
